version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Runs `go mod vendor` itself because `vendor/` exists.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"

  # `e2e/` is its own Go module with its own vendor directory.
  - package-ecosystem: "gomod"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gomod-e2e:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
