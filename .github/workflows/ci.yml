name: CI

on: [pull_request, push]

# A newer push cancels the running one for the same ref; tag runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-deny@0.18.9
      - run: cargo deny check

  # Not a gate for coverage/e2e: a gate cannot share its build cache with
  # downstream jobs, so it would only serialize a second compile.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  # macOS portability check. No Windows: comics ships only as a Linux image.
  check-cross:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-llvm-cov@0.6.14,cargo-nextest@0.9.87
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so build.rs `git describe` resolves a tagged version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e` is a separate workspace, so it must be named to be cached.
          workspaces: |
            .
            e2e
          # Own key: the only dev-profile build here, and an exact cache hit is
          # never re-saved, so a shared key could stay pinned to another profile.
          key: dev
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout. Dev profile: release is tuned for size, not test speed.
      - run: cargo build
      # Linted here to reuse this job's build. Not under `cargo deny`: the
      # browser stack's licences are outside the allow-list, and none of it
      # ships in the image.
      - run: cargo fmt --check
        working-directory: e2e
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: e2e
      # The runner ships Chrome; chromedriver is downloaded on demand.
      - run: cargo test --test e2e
        working-directory: e2e
