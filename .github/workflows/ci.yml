name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the running one for the same ref; tag runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Replaces `cargo deny`: every module is BSD or MIT licensed, so there is no
  # licence allow-list to enforce.
  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          unformatted="$(git ls-files -z '*.go' | grep -zv '^vendor/' | xargs -0 gofmt -l 2>&1)"
          echo "$unformatted"
          test -z "$unformatted"
      - run: go vet -mod=vendor ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # `e2e` is the only Rust left, so it is the only crate linted.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: e2e
      - run: cargo fmt --check
        working-directory: e2e
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: e2e

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `-coverprofile` ignores the binary cmd/comics's TestMain execs; with
      # COMICS_COVERDIR set it builds that binary with `-cover`.
      - run: |
          COMICS_COVERDIR="$PWD/covdata" go test -mod=vendor -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the VCS-stamped version resolves
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # `e2e` is a separate workspace, so it must be named to be cached.
          workspaces: e2e
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout.
      - run: go build -mod=vendor -o bin/comics ./cmd/comics
      # The runner ships Chrome; chromedriver is downloaded on demand.
      - run: cargo test --test e2e
        working-directory: e2e

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
