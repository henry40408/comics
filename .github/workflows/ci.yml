name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the running one for the same ref; tag runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny@0.18.9
      - run: cargo deny check

  # Not a gate for coverage/e2e: a gate cannot share its build cache with
  # downstream jobs, so it would only serialize a second compile.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e` is a separate workspace, so it must be named to be cached.
          workspaces: |
            .
            e2e
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Not under `cargo deny`: the browser stack's licences are outside the
      # allow-list, and none of it ships in the image.
      - run: cargo fmt --check
        working-directory: e2e
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: e2e

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-nextest@0.9.87
      - run: cargo nextest run

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-llvm-cov@0.6.14,cargo-nextest@0.9.87
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so build.rs `git describe` resolves a tagged version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e` is a separate workspace, so it must be named to be cached.
          workspaces: |
            .
            e2e
          # Own key: the only dev-profile build here, and an exact cache hit is
          # never re-saved, so a shared key could stay pinned to another profile.
          key: dev
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout. Dev profile: release is tuned for size, not test speed.
      - run: cargo build
      # The runner ships Chrome; chromedriver is downloaded on demand.
      - run: cargo test --test e2e
        working-directory: e2e
