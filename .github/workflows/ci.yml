name: CI

on: [pull_request, push]

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-deny@0.18.9
      - run: cargo deny check

  # Linux clippy. Runs in parallel with everything else — coverage/e2e are no
  # longer gated on it. On GitHub Actions a compile gate can't hand its build
  # cache to downstream jobs, so gating would only serialize a second compile
  # onto the critical path for no wall-clock win (the cheap checks, fmt/deny in
  # lint, don't validate compilation anyway). Kept ubuntu-only; macOS is below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  # macOS portability sanity check. Runs independently and still fails the
  # workflow on a regression, but does not block coverage/e2e. Windows was
  # dropped from the matrix: comics ships only as a Linux Docker image
  # (linux/amd64, linux/arm64 via distroless), so a Windows build had no
  # deployment value and was the slowest leg in the matrix.
  check-cross:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-llvm-cov@0.6.14,cargo-nextest@0.9.87
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so build.rs `git describe` resolves a tagged version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `e2e` is its own workspace, deliberately outside the root one, so it
          # has to be named or none of its dependencies are cached.
          workspaces: |
            .
            e2e
          # This job builds the server with the dev profile, unlike every other
          # job here. A cache key is only ever written once — an exact hit is
          # restored and never re-saved — so without a key of its own this job
          # would keep restoring whatever profile happened to populate the key
          # first, and rebuild all its dependencies every run.
          key: dev
      # The suite starts this binary itself; building it here keeps the
      # compile off the test's own timeout. Dev, not release: the release
      # profile is tuned for image size (LTO, one codegen unit, `opt-level =
      # "z"`) and none of that makes eight fixture pages serve faster.
      - run: cargo build
      # `e2e` is linted here rather than in `lint`, so it shares the build this
      # job already pays for. It is deliberately outside `cargo deny`: the
      # browser stack pulls in licences the server's allow-list does not carry,
      # and none of it is distributed — the Docker image contains the server
      # alone.
      - run: cargo fmt --check
        working-directory: e2e
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: e2e
      # No browser install step: the driver manager downloads a matching
      # chromedriver on demand, and the runner image already ships Chrome.
      - run: cargo test --test e2e
        working-directory: e2e
