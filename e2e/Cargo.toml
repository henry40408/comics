[package]
name = "comics-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser E2E tests and screenshot pipeline for Comics"

# Deliberately its own workspace, not a member of the one at the repository
# root. CI runs coverage as `cargo llvm-cov nextest --all-features --workspace`,
# which would otherwise compile thirtyfour and drive a real browser on every
# coverage run. `e2e/` was already a self-contained sub-project when it was
# JavaScript; this keeps that boundary.
[workspace]

[dependencies]
anyhow = "1.0.102"
cucumber = "0.23.0"
serde_json = "1.0.145"
# Pinned exactly: 0.37.5 was published 2026-08-12, inside the seven-day
# cooldown this project applies to fresh releases. Relax to a caret once it has
# aged out.
thirtyfour = "=0.37.4"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "time"] }

[[test]]
name = "e2e"
harness = false

# Mirrors the root crate's lint set, minus the entries that only apply to the
# server. Being a separate workspace means none of it is inherited, and test
# code that lints differently from the code it tests drifts.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
