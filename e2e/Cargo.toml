[package]
name = "comics-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser E2E tests and screenshot pipeline for Comics"

# Deliberately its own workspace: CI runs coverage with `--workspace`, which
# would otherwise drive a real browser on every coverage run.
[workspace]

[dependencies]
anyhow = "1.0.102"
cucumber = "0.23.0"
serde_json = "1.0.145"
thirtyfour = "0.37"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "time"] }

[[test]]
name = "e2e"
harness = false

# Mirrors the root crate's lint set (minus server-only entries); a separate
# workspace inherits none of it.
[lints.rust]
unexpected_cfgs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
